# FY 2024-25 (AY 2025-26). Every number here is cited in project_a/rules_source/fy2024_25.txt.
# Slab rows are [upper_limit_inclusive_or_null, rate_percent]. Surcharge rows [income_above, rate_percent].
fy: "2024-25"

rounding_unit: 10            # Sec 288A (income) and 288B (tax payable): nearest Rs 10, 5 rounds up

standard_deduction:          # [R1]
  old: {amount: 50000, clause: "Sec 16(ia)"}
  new: {amount: 75000, clause: "Sec 115BAC(1A)(ii) read with Sec 16(ia)"}

slabs:                       # [R10] [R11]
  old:
    below_60:             [[250000, 0], [500000, 5], [1000000, 20], [null, 30]]
    senior_60_79:         [[300000, 0], [500000, 5], [1000000, 20], [null, 30]]
    super_senior_80_plus: [[500000, 0], [1000000, 20], [null, 30]]
  new:
    all: [[300000, 0], [700000, 5], [1000000, 10], [1200000, 15], [1500000, 20], [null, 30]]

rebate_87a:                  # [R12]
  old: {income_limit: 500000, max_rebate: 12500, marginal_relief: false}
  new: {income_limit: 700000, max_rebate: 25000, marginal_relief: true}

surcharge:                   # [R13]  rate applies when total income EXCEEDS the threshold
  old: [[5000000, 10], [10000000, 15], [20000000, 25], [50000000, 37]]
  new: [[5000000, 10], [10000000, 15], [20000000, 25]]

cess_percent: 4              # [R14]

deductions:                  # old regime only [R3]-[R6]
  sec_80c_cap: 150000
  sec_80ccd_1b_cap: 50000
  sec_80d: {self_cap: 25000, self_senior_cap: 50000, parents_cap: 25000, parents_senior_cap: 50000}
  home_loan_interest_cap: 200000
  hra: {metro_pct: 50, non_metro_pct: 40, rent_minus_basic_pct: 10}   # [R2]
