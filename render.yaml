services:
  - type: web
    name: fireai-rules-vs-llms-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app_api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: LLM_CACHE
        value: "1"
      - key: LLM_BACKEND
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
